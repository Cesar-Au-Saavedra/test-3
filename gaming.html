<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L&amp;D Hub — Leaderboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav-root"></div>

<div class="page-shell">
<div class="side-illustration left">
  <div class="side-card"><img src="success-left.jpg" alt="Celebrating success"><div class="side-caption">Earn points,<br>climb ranks</div></div>
</div>
<div class="side-illustration right">
  <div class="side-card"><img src="team-learning-right.jpg" alt="Team learning together"><div class="side-caption">Compete with<br>your team</div></div>
</div>

<main>
  <h2 class="section-title">Leaderboard</h2>
  <p style="color:#64748b;font-size:14px;margin-bottom:18px;">Points are earned for completed activities and finished courses. (Demo scoring, not real.)</p>
  <table class="leaderboard" id="lbTable">
    <thead><tr><th>Rank</th><th>Learner</th><th>Points</th><th>Badge</th></tr></thead>
    <tbody id="lbBody"></tbody>
  </table>
</main>
</div>

<footer>Drafted with AI assistance</footer>

<script src="data.js"></script>
<script>
  renderNav("gaming.html");
  const me = getCurrentUser();
  const ranked = [...DEMO_USERS].sort((a,b) => b.points - a.points);

  function badgeFor(points) {
    if (points >= 1000) return "Gold";
    if (points >= 700) return "Silver";
    return "Bronze";
  }

  document.getElementById("lbBody").innerHTML = ranked.map((u, i) => `
    <tr class="${u.id===me.id ? 'me':''}">
      <td>#${i+1}</td>
      <td>${u.name}${u.id===me.id ? " (you)" : ""}</td>
      <td>${u.points} pts</td>
      <td><span class="badge-pill">${badgeFor(u.points)}</span></td>
    </tr>
  `).join("");
</script>
</body>
</html>
