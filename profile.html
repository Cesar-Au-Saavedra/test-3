<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L&amp;D Hub — My Profile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav-root"></div>

<div class="page-shell">
<div class="side-illustration left">
  <div class="side-card"><img src="profile-left.jpg" alt="Celebrating success"><div class="side-caption">Your learner<br>ID card</div></div>
</div>
<div class="side-illustration right">
  <div class="side-card"><img src="profile-right.jpg" alt="Managing settings"><div class="side-caption">Manage your<br>settings</div></div>
</div>

<main>
  <h2 class="section-title">My Profile</h2>
  <p style="color:#94a3b8;font-size:12px;margin-top:-10px;margin-bottom:20px;font-style:italic;">Laid out like our real TalentLMS profile page — every field here is demo data and nothing is actually saved, changed, or deleted.</p>
  <div id="profileRoot"></div>
</main>
</div>

<div id="saveToast"></div>
<footer>Drafted with AI assistance</footer>

<script src="data.js"></script>
<script>
  renderNav("profile.html");
  const user = getCurrentUser();
  const [first, ...rest] = user.name.split(" ");
  const last = rest.join(" ");
  const emailDomain = user.id === "u1" ? "cesar.saavedra@doxatalent.com" : (user.name.toLowerCase().replace(/\s+/g,".") + "@doxatalent.com");
  const username = emailDomain.split("@")[0];

  document.getElementById("profileRoot").innerHTML = `

    <div class="profile-section">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:18px;">
        <div class="avatar" style="background:${user.color};margin:0;">${user.initials}</div>
        <div>
          <div style="font-weight:700;font-size:17px;">${user.name}</div>
          <div style="color:#64748b;font-size:13.5px;">${user.role}</div>
        </div>
      </div>
      <h3>Basic Info</h3>
      <div class="form-grid">
        <div class="form-field"><label>First name</label><input type="text" value="${first}"></div>
        <div class="form-field"><label>Last name</label><input type="text" value="${last}"></div>
        <div class="form-field" style="grid-column:1 / -1;"><label>Email</label><input type="email" value="${emailDomain}"></div>
        <div class="form-field" style="grid-column:1 / -1;"><label>Bio</label><textarea placeholder="Say a bit about yourself...">Learning &amp; Development at DOXA Talent.</textarea></div>
      </div>
      <div class="role-select">
        <label style="font-size:12.5px;color:#475569;font-weight:600;">Role (demo — a real version would be admin-controlled)</label><br>
        <select id="roleSelect" style="margin-top:6px;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;">
          <option ${user.role==="Learner" ? "selected":""}>Learner</option>
          <option ${user.role==="Admin" ? "selected":""}>Admin</option>
        </select>
      </div>
    </div>

    <div class="profile-section">
      <h3>Sign-in Credentials</h3>
      <div class="form-grid">
        <div class="form-field"><label>Username</label><input type="text" value="${username}" readonly></div>
        <div class="form-field">
          <label>Password</label>
          <button class="btn-secondary" type="button" onclick="demoAction('Password change')">Change Password</button>
        </div>
      </div>
      <div class="row-between" style="margin-top:16px;">
        <div>
          <div style="font-weight:600;font-size:13.5px;">Two-Factor Authentication (2FA)</div>
          <div class="hint">Demo state — not actually configured</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="status-pill">Not set up</span>
          <button class="btn-secondary" type="button" onclick="demoAction('2FA setup')">Set Up 2FA</button>
        </div>
      </div>
    </div>

    <div class="profile-section">
      <h3>Location &amp; Language</h3>
      <div class="form-grid">
        <div class="form-field">
          <label>Timezone</label>
          <select><option selected>(GMT -05:00) Bogotá, Quito</option><option>(GMT -05:00) New York</option><option>(GMT +00:00) London</option></select>
        </div>
        <div class="form-field">
          <label>Language</label>
          <select><option selected>English</option><option>Español</option></select>
        </div>
      </div>
    </div>

    <div class="profile-section">
      <h3>Email &amp; Notifications</h3>
      <div class="toggle-row">
        <input type="checkbox" id="muteEmails">
        <label for="muteEmails" style="font-size:13.5px;">Exclude me from all non-essential emails and notifications</label>
      </div>
    </div>

    <div class="profile-section">
      <h3>Conference Integration</h3>
      <div class="row-between">
        <div style="font-size:13.5px;color:#475569;">Connect your calendar/meeting tool for session invites</div>
        <button class="btn-secondary" type="button" onclick="demoAction('Microsoft Teams connection')">Connect with Microsoft Teams</button>
      </div>
    </div>

    <div class="profile-section danger">
      <h3 style="color:#b91c1c;">Delete Your Account</h3>
      <p style="font-size:13px;color:#64748b;margin-bottom:12px;">Caution: deleting your account removes you from the service. (Disabled in this prototype — no account is actually touched.)</p>
      <button class="btn-danger" type="button" onclick="demoAction('Account deletion')">Delete Account</button>
    </div>

    <div class="row-between">
      <button class="resume-btn" type="button" onclick="showToast('Changes saved — demo only, nothing was actually stored')">Save Changes</button>
      <a href="index.html" style="font-size:13.5px;color:#64748b;text-decoration:none;">Cancel</a>
    </div>

    <p style="font-size:12px;color:#94a3b8;margin-top:18px;font-style:italic;">In this prototype, switching your viewing user from the top-right menu is how you "log in" as someone else. A real version would need actual authentication, and none of the buttons above perform a real action.</p>
  `;

  function demoAction(label) { showToast(label + " — disabled in this prototype"); }
  function showToast(msg) {
    const t = document.getElementById("saveToast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }
</script>
</body>
</html>
