<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L&amp;D Hub — My Profile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="demo-banner">Click-through prototype — fake sample data only. Not connected to real learners or TalentLMS.</div>
<div id="nav-root"></div>

<main>
  <h2 class="section-title">My Profile</h2>
  <div class="contact-box" style="text-align:left;" id="profileBox"></div>
</main>

<footer>Original design concept · Drafted with AI assistance · Click-through prototype, Mission 6 — not a replacement for DOXA's official LMS</footer>

<script src="data.js"></script>
<script>
  renderNav("profile.html");
  const user = getCurrentUser();

  document.getElementById("profileBox").innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:18px;">
      <div class="avatar" style="background:${user.color};margin:0;">${user.initials}</div>
      <div>
        <div style="font-weight:700;font-size:17px;">${user.name}</div>
        <div style="color:#64748b;font-size:13.5px;">${user.role}</div>
      </div>
    </div>
    <div class="role-select">
      <label style="font-size:13px;color:#475569;">Role (demo — real version would be admin-controlled)</label><br>
      <select id="roleSelect" style="margin-top:6px;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;">
        <option ${user.role==="Learner" ? "selected":""}>Learner</option>
        <option ${user.role==="Admin" ? "selected":""}>Admin</option>
      </select>
    </div>
    <p style="font-size:12px;color:#94a3b8;margin-top:16px;font-style:italic;">In this prototype, switching your viewing user from the top-right menu is how you "log in" as someone else. A real version would need actual authentication.</p>
  `;
</script>
</body>
</html>
