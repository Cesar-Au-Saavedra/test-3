<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L&amp;D Hub — My Profile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav-root"></div>

<div class="page-shell">
<div class="side-illustration left">
  <div class="illus-card"><svg viewBox="0 0 100 90">
  <circle cx="50" cy="26" r="10" fill="#16a34a"/>
  <path d="M50 36 L50 62 M50 42 L28 22 M50 42 L72 22 M50 62 L33 84 M50 62 L67 84" stroke="#16a34a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="14" cy="14" r="3" fill="#05AF72"/>
  <circle cx="88" cy="18" r="3" fill="#052538"/>
  <circle cx="18" cy="70" r="3" fill="#05AF72"/>
  <circle cx="84" cy="66" r="3" fill="#052538"/>
</svg><div class="illus-caption">Your learner<br>ID card</div></div>
</div>
<div class="side-illustration right">
  <div class="illus-card"><svg viewBox="0 0 100 90">
  <path d="M10 40 L50 10 L90 40" fill="none" stroke="#052538" stroke-width="4" stroke-linecap="round"/>
  <rect x="25" y="55" width="50" height="4" rx="2" fill="#052538"/>
  <rect x="30" y="59" width="4" height="16" fill="#052538"/>
  <rect x="66" y="59" width="4" height="16" fill="#052538"/>
  <rect x="40" y="46" width="20" height="12" rx="1" fill="#2563eb"/>
  <circle cx="50" cy="30" r="9" fill="#2563eb"/>
  <path d="M38 55c0-9 6-15 12-15s12 6 12 15z" fill="#2563eb"/>
  <rect x="78" y="62" width="8" height="10" rx="1" fill="#052538"/>
  <circle cx="82" cy="58" r="5" fill="#05AF72"/>
</svg><div class="illus-caption">Manage your<br>settings</div></div>
</div>

<main>
  <h2 class="section-title" data-i18n="profile_title">My Profile</h2>
  <div id="profileRoot"></div>
</main>
</div>

<div id="saveToast"></div>

<script src="data.js"></script>
<script>
  renderNav("profile.html");
  const user = getCurrentUser();
  const [first, ...rest] = user.name.split(" ");
  const last = rest.join(" ");
  const emailDomain = user.id === "u1" ? "cesar.saavedra@doxatalent.com" : (user.name.toLowerCase().replace(/\s+/g,".") + "@doxatalent.com");
  const username = emailDomain.split("@")[0];
  const currentTz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) { return "America/Bogota"; } })();

  function render() {
    const tzList = allTimezones();
    const lang = getLang();

    document.getElementById("profileRoot").innerHTML = `

      <div class="profile-section">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:18px;">
          <div class="avatar" style="background:${user.color};margin:0;">${user.initials}</div>
          <div>
            <div style="font-weight:700;font-size:17px;">${user.name}</div>
            <div style="color:#64748b;font-size:13.5px;">${user.role}</div>
          </div>
        </div>
        <h3>${T("basic_info")}</h3>
        <div class="form-grid">
          <div class="form-field"><label>${T("first_name")}</label><input type="text" value="${first}"></div>
          <div class="form-field"><label>${T("last_name")}</label><input type="text" value="${last}"></div>
          <div class="form-field" style="grid-column:1 / -1;"><label>${T("email_label")}</label><input type="email" value="${emailDomain}"></div>
          <div class="form-field" style="grid-column:1 / -1;"><label>${T("bio_label")}</label><textarea>Learning &amp; Development at DOXA Talent.</textarea></div>
        </div>
        <div class="role-select">
          <label style="font-size:12.5px;color:#475569;font-weight:600;">${T("role_label")}</label><br>
          <select id="roleSelect" style="margin-top:6px;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;">
            <option ${user.role==="Learner" ? "selected":""}>Learner</option>
            <option ${user.role==="Admin" ? "selected":""}>Admin</option>
          </select>
        </div>
      </div>

      <div class="profile-section">
        <h3>${T("signin_credentials")}</h3>
        <div class="form-grid">
          <div class="form-field"><label>${T("username_label")}</label><input type="text" value="${username}" readonly></div>
          <div class="form-field">
            <label>Password</label>
            <button class="btn-secondary" type="button" onclick="demoAction('Password change')">${T("change_password")}</button>
          </div>
        </div>
        <div class="row-between" style="margin-top:16px;">
          <div style="font-weight:600;font-size:13.5px;">${T("two_factor")}</div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="status-pill">${T("not_set_up")}</span>
            <button class="btn-secondary" type="button" onclick="demoAction('2FA setup')">${T("set_up_2fa")}</button>
          </div>
        </div>
      </div>

      <div class="profile-section">
        <h3>${T("location_language")}</h3>
        <div class="form-grid">
          <div class="form-field">
            <label>${T("timezone_label")}</label>
            <input type="text" id="tzSearch" data-i18n-placeholder="tz_search" placeholder="Search timezones..." style="margin-bottom:6px;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13.5px;">
            <select id="tzSelect">
              ${tzList.map(tz => `<option value="${tz}" ${tz===currentTz ? "selected":""}>${timezoneLabel(tz)}</option>`).join("")}
            </select>
          </div>
          <div class="form-field">
            <label>${T("language_label")}</label>
            <select id="langSelect">
              ${LANGUAGES.map(l => `<option value="${l.code}" ${l.code===lang ? "selected":""}>${l.label}</option>`).join("")}
            </select>
          </div>
        </div>
      </div>

      <div class="profile-section">
        <h3>${T("email_notifications")}</h3>
        <div class="toggle-row">
          <input type="checkbox" id="muteEmails">
          <label for="muteEmails" style="font-size:13.5px;">${T("exclude_emails")}</label>
        </div>
      </div>

      <div class="profile-section">
        <h3>${T("conference_integration")}</h3>
        <div class="row-between">
          <div style="font-size:13.5px;color:#475569;">${T("conference_desc")}</div>
          <button class="btn-secondary" type="button" onclick="demoAction('Microsoft Teams connection')">${T("connect_teams")}</button>
        </div>
      </div>

      <div class="profile-section danger">
        <h3 style="color:#b91c1c;">${T("delete_account")}</h3>
        <p style="font-size:13px;color:#64748b;margin-bottom:12px;">${T("delete_caution")}</p>
        <button class="btn-danger" type="button" onclick="demoAction('Account deletion')">${T("delete_btn")}</button>
      </div>

      <div class="row-between">
        <button class="resume-btn" type="button" onclick="showToast('Changes saved — demo only, nothing was actually stored')">${T("save_changes")}</button>
        <a href="index.html" style="font-size:13.5px;color:#64748b;text-decoration:none;">${T("cancel")}</a>
      </div>
    `;

    document.getElementById("langSelect").addEventListener("change", (e) => {
      applyLanguage(e.target.value);
    });

    const tzSelect = document.getElementById("tzSelect");
    document.getElementById("tzSearch").addEventListener("input", (e) => {
      const term = e.target.value.trim().toLowerCase();
      const prevValue = tzSelect.value;
      const filtered = term ? tzList.filter(tz => timezoneLabel(tz).toLowerCase().includes(term)) : tzList;
      tzSelect.innerHTML = filtered.map(tz => `<option value="${tz}" ${tz===prevValue ? "selected":""}>${timezoneLabel(tz)}</option>`).join("")
        || `<option disabled selected>No matches</option>`;
    });
  }

  function demoAction(label) { showToast(label + " — disabled in this prototype"); }
  function showToast(msg) {
    const t = document.getElementById("saveToast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  window.onLanguageApplied = render;
  applyLanguage(getLang());
</script>
</body>
</html>
